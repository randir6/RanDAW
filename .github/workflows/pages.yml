# Publish the page to GitHub Pages: build it, run the checks, and put the
# result at https://<owner>.github.io/<repo>/ -- on every push to the default
# branch, or by hand from the Actions tab ("Run workflow").
#
# Needs Settings -> Pages -> Source set to "GitHub Actions" (once).

name: Publish page

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pushes to other branches are ignored, so work in progress never goes live.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checks
        working-directory: web
        # The runner comes with Chrome, which the browser checks drive.
        run: CHROMIUM="$(command -v google-chrome)" npm test
      - name: Build
        working-directory: web
        run: node build.js
      - name: Gather the site
        # index.html, so the bare address opens the page.
        run: mkdir _site && cp web/dist/randaw.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

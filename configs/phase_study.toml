# A phasing study. The pluck has 5 beats but 7 notes, so its melody only
# returns to the start after LCM(5,7) = 35 beats, which is 7 cycles -- the
# exact length of this render. The kick holds a steady 4 to hear it against.

cycle_duration = 2.4
loops = 7

[[layer]]
beats = 5
notes = [0, 3, 7, 10, 12, 7, 3]   # 7 notes over 5 beats
sample = "../samples/pluck.wav"
gain = 0.38

[[layer]]
beats = 3
notes = [0, 12]
sample = "../samples/bell.wav"
gain = 0.22

[[layer]]
beats = 4
notes = [0]
sample = "../samples/kick.wav"
gain = 0.50

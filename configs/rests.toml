# Rests: "-" in a sequence means "sound nothing here".
#
#   python3 generate.py --config configs/rests.toml --out rests.wav
#
# Worth knowing how a rest differs from `active`. An inactive beat is silent
# on the SAME beat every cycle. A rest travels with the SEQUENCE, so when the
# sequence is a different length from the beat count, the silence lands
# somewhere new each time round. The pluck below has 7 positions over 5
# beats, so its two rests walk through the bar.

cycle_duration = 2.2
loops = 6
scale = "dorian"

[[layer]]
beats = 5
degrees = [1, "-", 5, 4, "-", 2, 8]   # 7 positions, 5 beats: the rests move
sample = "../samples/pluck.wav"
gain = 0.38

[[layer]]
beats = 3
degrees = [1, "-", 5]
root = 12
sample = "../samples/bell.wav"
gain = 0.18

# Drums use semitones, where 0 means unison -- which is exactly why a rest
# needs its own marker rather than being written as 0.
[[layer]]
beats = 8
notes = [0, "-", 0, 0, "-", 0]
sample = "../samples/kick.wav"
gain = 0.60

[[layer]]
beats = 8
notes = [0]
sample = "../samples/hat.wav"
gain = 0.14
active = [3, 6, 8]

# Scale degrees rather than semitones.
#
# The melodic layers below say WHICH DEGREE of the scale to play, not which
# interval. Change the one `scale` line at the top and the whole piece
# re-harmonises without touching a single note number. Try:
#
#   minor, dorian, phrygian, lydian, mixolydian, major,
#   minor_pentatonic, blues, harmonic_minor, whole_tone
#
#   python3 generate.py --config configs/scales.toml --out scales.wav

cycle_duration = 2.4
loops = 6

scale = "dorian"   # <- change this one word
root = 0           # semitones to transpose everything by

# Degrees count from 1 as musicians do: 1 is the root, 3 the third, 5 the
# fifth. Past the end of the scale they wrap up an octave, so 8 is the octave
# above 1. Below 1 they run downwards, so 0 sits one step under the root.

[[layer]]
beats = 5
degrees = [1, 3, 5, 8, 5, 3, 2]   # 7 degrees over 5 beats, so it phases
sample = "../samples/pluck.wav"
gain = 0.30

[[layer]]
beats = 3
degrees = [1, 5]                  # root and fifth, an octave up
root = 12
sample = "../samples/bell.wav"
gain = 0.15

[[layer]]
beats = 4
degrees = [1, 1, 4, 3]            # a bassline, an octave below the root
root = -12
sample = "../samples/tom.wav"
gain = 0.26

# Drums state pitches as `notes` (plain semitones), so the scale above never
# touches them. That separation is the point of having two different fields.
[[layer]]
beats = 8
notes = [0]
sample = "../samples/kick.wav"
gain = 0.52
active = [1, 4, 7]

[[layer]]
beats = 8
notes = [0]
sample = "../samples/hat.wav"
gain = 0.12
active = [3, 6, 8]

# Seven, grouped 3-2-2, with a 4-beat tom pulling against it.

cycle_duration = 2.8
loops = 6

[[layer]]
beats = 7
notes = [0]
sample = "../samples/kick.wav"
gain = 0.70
active = [1, 4, 6]     # the 3-2-2 grouping

[[layer]]
beats = 7
notes = [0]
sample = "../samples/snare.wav"
gain = 0.33
active = [3]

[[layer]]
beats = 7
notes = [0]
sample = "../samples/hat.wav"
gain = 0.18
active = [2, 5, 7]     # fills the beats the kick leaves alone

[[layer]]
beats = 4              # 4 against 7 never repeats within a cycle
notes = [0, -4]
sample = "../samples/tom.wav"
gain = 0.30

# Tresillo (3-3-2) with a 3-beat hat cutting across it.
#
# Render with:  python3 generate.py --config configs/tresillo.toml --out t.wav
# Add --loops 1 for a quick preview; anything on the command line wins.
#
# Paths below resolve relative to THIS FILE, not wherever you run from.

cycle_duration = 2.0   # seconds for one full cycle; every layer divides this
loops = 8

# out = "../tresillo.wav"   # uncomment to set the output here instead of --out

[[layer]]
beats = 8
notes = [0]
sample = "../samples/kick.wav"
gain = 0.75
active = [1, 4, 7]     # the tresillo: 3 + 3 + 2

[[layer]]
beats = 8
notes = [0]
sample = "../samples/snare.wav"
gain = 0.42
active = [5]           # backbeat, holding it steady

[[layer]]
beats = 3              # 3 against 8: this is the actual polyrhythm
notes = [0]
sample = "../samples/hat.wav"
gain = 0.20

[[layer]]
beats = 8
notes = [0, 3, 7, 10, 7, 3]   # minor pentatonic, phasing against 8 beats
sample = "../samples/pluck.wav"
gain = 0.30
active = [3, 6, 8]

<!doctype html>
<!--
  The RanDAW visualiser page.

  This file is a TEMPLATE: polyrhythm/visualise.py reads it, drops the piece's
  data and audio into the two <script type="application/json"> blocks near the
  bottom, and writes out one self-contained .html file. That file needs no
  server, no internet connection and nothing installed -- open it in a browser.

  The ground rule for everything below: NO MUSICAL LOGIC LIVES HERE. Which beat
  sounds, what it is labelled, how high it sits, which layers coincide -- all
  of that was worked out and tested in Python. This page only draws what it is
  given and plays the audio. If the page ever needs to decide something
  musical, that decision belongs in Python instead.

  Three languages share this one file, which is normal for a web page:
    HTML  -- the structure: headings, buttons, the empty drawing area.
    CSS   -- the look: colours, sizes, light and dark mode. Inside <style>.
    JavaScript -- the behaviour: drawing, playing, reacting to clicks. Inside
    the last <script>.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Without this, phones render the page as a shrunken desktop page. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · RanDAW</title>
<style>
  /*
    Colours are defined once as "custom properties" (the --names) and used by
    name everywhere else, so light and dark mode only have to swap this list.
    The five layer colours are a colourblind-checked palette: every pair of
    neighbouring rows stays distinguishable under the common kinds of colour
    blindness, verified with a script rather than by eye.
  */
  :root {
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --row: #f3f2ee;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --bar: #c3c2b7;
    /* Text drawn on top of a coloured note. Near-black in BOTH modes, because
       every layer colour is mid-bright and dark text reads clearly on all of
       them -- white would be marginal on the yellow and pink. */
    --mark-ink: #0b0b0b;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  }
  /* The same colours stepped for a dark background: a separate, re-checked
     set rather than an automatic inversion, which would change their meaning. */
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d;
      --surface: #1a1a19;
      --row: #222220;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --bar: #4a4a46;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 24px 32px;
    background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 2px; font-weight: 650; }
  .meta { color: var(--ink-2); margin: 0 0 14px; }
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  button {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--bar); border-radius: 8px; padding: 6px 14px; cursor: pointer;
  }
  button:hover { border-color: var(--ink-2); }
  button:disabled { opacity: .45; cursor: default; }
  #play { min-width: 92px; font-weight: 600; }
  .clock { font-variant-numeric: tabular-nums; color: var(--ink-2); min-width: 120px; }
  .window { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .note-text { color: var(--muted); font-size: 13px; }

  figure { margin: 0; background: var(--surface); border-radius: 12px; padding: 8px 6px; }
  svg { display: block; width: 100%; height: auto; }

  /* --- The drawing ---------------------------------------------------------
     Each layer's row carries a class l0..l4, which sets --c to that layer's
     colour. Everything inside the row then says "use --c", so a mark never
     needs to know which layer it belongs to. */
  .l0 { --c: var(--s1); } .l1 { --c: var(--s2); } .l2 { --c: var(--s3); }
  .l3 { --c: var(--s4); } .l4 { --c: var(--s5); }

  .row-bg { fill: var(--row); }
  .cycle-label { fill: var(--muted); font-size: 13px; }
  .bar-line { stroke: var(--bar); stroke-width: 1.5; }
  .name { fill: var(--ink); font-size: 16px; font-weight: 650; }
  .sub { fill: var(--ink-2); font-size: 12.5px; }
  .swatch { fill: var(--c); }

  /* The span of time each beat occupies, from its onset to the next. */
  .band { rx: 4px; }
  .band.note { fill: var(--c); fill-opacity: .13; }
  .band.rest { fill: none; stroke: var(--muted); stroke-dasharray: 3 3; stroke-opacity: .7; }
  .band.inactive { fill: url(#hatch); }
  .hatch-line { stroke: var(--muted); stroke-opacity: .45; stroke-width: 1.5; }

  /* A sounding note. The ring in the page colour keeps overlapping marks
     visibly separate. transform-box lets it grow from its own centre. */
  .mark { transform-box: fill-box; transform-origin: center; transition: transform .06s; }
  .mark circle { fill: var(--c); stroke: var(--surface); stroke-width: 2; }
  .mark text { fill: var(--mark-ink); font-weight: 650; text-anchor: middle; dominant-baseline: central; }
  .hit line { stroke: var(--c); stroke-width: 3.5; stroke-linecap: round; }
  /* The invisible circle behind an x only exists to make it easier to hover.
     `stroke: none` stops it inheriting the ring every note circle gets. */
  .hit circle { fill: transparent; stroke: none; }
  .rest-glyph { fill: var(--ink-2); }
  .mark.on { transform: scale(1.35); }
  .mark.on circle { stroke: var(--ink); }

  /* Where two or more layers sound at the same instant. */
  .together { stroke: var(--ink-2); stroke-width: 1.5; stroke-opacity: .35; }
  .together.on { stroke-opacity: .9; stroke-width: 2.5; }

  .playhead { stroke: var(--ink); stroke-width: 2; }
  .stage { cursor: pointer; }

  .legend { display: flex; flex-wrap: wrap; gap: 18px; margin: 12px 2px 0; color: var(--ink-2); font-size: 13.5px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend svg { width: 22px; height: 16px; }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--ink-2); }
  pre { font-size: 13px; line-height: 1.6; overflow-x: auto; background: var(--surface); padding: 12px; border-radius: 10px; }
</style>
</head>
<body>

<h1 id="title">{{TITLE}}</h1>
<p class="meta" id="meta"></p>

<div class="controls">
  <button id="play" type="button">Play</button>
  <span class="clock" id="clock"></span>
  <button id="prev" type="button" aria-label="Earlier cycles">&larr;</button>
  <span class="window" id="window"></span>
  <button id="next" type="button" aria-label="Later cycles">&rarr;</button>
  <span class="note-text" id="note-text">Space plays and pauses · click the grid to jump · arrow keys change page</span>
</div>

<figure>
  <svg id="stage" class="stage" xmlns="http://www.w3.org/2000/svg" role="img"></svg>
</figure>

<!-- Legend marks are grey on purpose: they describe a shape, and a coloured
     one would suggest it belonged to a particular layer. -->
<div class="legend" aria-hidden="true">
  <span><svg viewBox="0 0 22 16"><circle cx="11" cy="8" r="6.5" fill="var(--ink-2)"/></svg>note — higher in the row is higher in pitch</span>
  <span><svg viewBox="0 0 22 16"><path d="M6 3 L16 13 M16 3 L6 13" stroke="var(--ink-2)" stroke-width="3" stroke-linecap="round"/></svg>drum hit</span>
  <span><svg viewBox="0 0 22 16"><rect x="5" y="6" width="12" height="5" rx="1" fill="var(--ink-2)"/></svg>rest — moves with the sequence</span>
  <span><svg viewBox="0 0 22 16"><rect x="2" y="1" width="18" height="14" rx="3" fill="url(#hatch)" stroke="var(--muted)" stroke-opacity=".5"/></svg>beat switched off — same place every cycle</span>
  <span><svg viewBox="0 0 22 16"><line x1="11" y1="1" x2="11" y2="15" stroke="var(--ink-2)" stroke-width="2"/></svg>layers sounding together</span>
</div>

<details>
  <summary>The grid as text</summary>
  <pre id="text-grid"></pre>
</details>

<!--
  The data. type="application/json" tells the browser this is not code to
  run, just text to hold -- the script below reads it with JSON.parse.
-->
<script type="application/json" id="piece-data">{{PIECE_JSON}}</script>
<script type="application/json" id="audio-data">"{{AUDIO_B64}}"</script>

<script>
"use strict";  // makes JavaScript refuse some sloppy code instead of guessing

// Any error ends up as an attribute on the page, where the automated check
// in qa_check.py can see it. Otherwise a broken page would just look empty.
window.addEventListener("error", (e) => {
  document.documentElement.dataset.error = String(e.message);
});

// ---------------------------------------------------------------------------
// The data Python prepared
// ---------------------------------------------------------------------------
const piece = JSON.parse(document.getElementById("piece-data").textContent);
const d = piece.derived;
const nLayers = d.layers.length;

// ?t=3.2 in the address shows a still frame at 3.2 seconds, without audio.
// URLSearchParams reads the part of the address after the "?".
const params = new URLSearchParams(location.search);
const stillTime = params.has("t") ? parseFloat(params.get("t")) : null;

// ---------------------------------------------------------------------------
// Layout. The drawing is sized in its own units (1600 wide) and the browser
// scales it to the window, so none of these numbers depend on screen size.
// ---------------------------------------------------------------------------
const W = 1600, GUTTER = 210, RIGHT = 22, TOP = 40, ROW_H = 120, ROW_GAP = 12;
const AREA = W - GUTTER - RIGHT;
const H = TOP + nLayers * (ROW_H + ROW_GAP) + 6;
const MIN_CELL = 20;  // narrower than this and a labelled note will not fit
const GUTTER_CHARS = 25;  // about as many small characters as fit in the gutter

// How many cycles to show side by side. Up to four, but fewer when a layer has
// so many beats that four cycles would squash each one below MIN_CELL wide.
const maxBeats = Math.max(...d.layers.map((l) => l.beats));
let WINDOW = 4;
while (WINDOW > 1 && AREA / WINDOW / maxBeats < MIN_CELL) WINDOW -= 1;
WINDOW = Math.min(WINDOW, d.loops);
const BAR_W = AREA / WINDOW;
const pages = Math.ceil(d.loops / WINDOW);

// Each cell and coincidence, grouped by the page it appears on, so drawing a
// page does not have to search the whole piece.
const cellsByPage = Array.from({ length: pages }, () => []);
for (const c of d.cells) cellsByPage[Math.floor((c.cycle - 1) / WINDOW)].push(c);
const togetherByPage = Array.from({ length: pages }, () => []);
for (const k of d.coincidences) togetherByPage[Math.floor((k.cycle - 1) / WINDOW)].push(k);

// Where things go on screen.
const rowTop = (layer) => TOP + layer * (ROW_H + ROW_GAP);
const barX = (slot) => GUTTER + slot * BAR_W;
const xOf = (cycle, offset, page) => barX(cycle - 1 - page * WINDOW) + offset * BAR_W;
// A note's size depends on how much room its layer has per beat.
const radius = (layer) => Math.max(8, Math.min(14, (BAR_W / d.layers[layer].beats) * 0.4));
const yOf = (layer, height) => {
  const pad = radius(layer) + 7;
  // height runs 0 (lowest pitch) to 1 (highest); screen y runs downwards,
  // so it is flipped with 1 - height.
  return rowTop(layer) + pad + (1 - height) * (ROW_H - 2 * pad);
};

// ---------------------------------------------------------------------------
// Drawing. SVG elements need their own "namespace", hence the long address
// passed to createElementNS -- a quirk of how browsers tell SVG from HTML.
// ---------------------------------------------------------------------------
const SVG_NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("stage");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

function el(name, attrs = {}, parent = null, text = null) {
  const node = document.createElementNS(SVG_NS, name);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  if (text !== null) node.textContent = text;
  if (parent) parent.appendChild(node);
  return node;
}

// A hover tooltip. The browser shows an SVG <title> when the pointer rests on
// its parent, with no code needed to position it.
function tip(node, text) { el("title", {}, node, text); }

function pitchWords(layer, c) {
  const info = d.layers[layer];
  if (info.percussive) return "hit";
  const semis = c.semitones >= 0 ? `+${c.semitones}` : `${c.semitones}`;
  return info.pitch_kind === "degrees"
    ? `degree ${c.label} of ${info.scale} (${semis} semitones)`
    : `${semis} semitones`;
}

let currentPage = -1;
let marks = [];      // [{node, time}] for notes on the current page
let togethers = [];  // [{node, time}] for coincidence lines on the current page
let playhead = null;

function drawPage(page) {
  currentPage = page;
  svg.replaceChildren();  // empty it and start again
  marks = [];
  togethers = [];

  // The diagonal hatching used for switched-off beats.
  const defs = el("defs", {}, svg);
  const pat = el("pattern", {
    id: "hatch", width: 7, height: 7, patternUnits: "userSpaceOnUse",
    patternTransform: "rotate(45)",
  }, defs);
  el("line", { x1: 0, y1: 0, x2: 0, y2: 7, class: "hatch-line" }, pat);

  // Drawn in layers, back to front: rows, then the lines joining coincident
  // notes, then the playhead, then the notes on top -- so a note under the
  // playhead stays readable while it sounds.
  const back = el("g", {}, svg);
  const joins = el("g", {}, svg);
  const under = el("g", {}, svg);
  const front = el("g", {}, svg);

  // Rows, with each layer's name and description in the left gutter.
  for (let i = 0; i < nLayers; i++) {
    const info = d.layers[i];
    const g = el("g", { class: `l${i}` }, back);
    el("rect", { x: 4, y: rowTop(i), width: W - 8, height: ROW_H, rx: 10, class: "row-bg" }, g);
    el("circle", { cx: 22, cy: rowTop(i) + 26, r: 7, class: "swatch" }, g);
    el("text", { x: 36, y: rowTop(i) + 31, class: "name" }, g, info.name);
    const kind = info.percussive ? "drum hits"
      : info.pitch_kind === "degrees" ? `${info.scale} degrees` : "semitones";
    const lines = [`${info.beats} beats · ${kind}`];
    // A drum's sequence is only worth printing when it has rests in it --
    // otherwise it is just "x", which the row already shows.
    if (!info.percussive || info.sequence_labels.includes("-")) {
      lines.push(`seq ${info.sequence_labels.join(" ")}`);
    }
    if (info.active) lines.push(`on: ${info.active.join(" ")}`);
    lines.forEach((text, n) => {
      // The gutter is a fixed width, so a long line is cut short with "…"
      // rather than running into the grid. Hovering shows it in full.
      const short = text.length > GUTTER_CHARS ? `${text.slice(0, GUTTER_CHARS - 1)}…` : text;
      const node = el("text", { x: 22, y: rowTop(i) + 56 + n * 20, class: "sub" }, g, short);
      if (short !== text) tip(node, text);
    });
  }

  // Cycle numbers and the bar lines between cycles.
  for (let slot = 0; slot < WINDOW; slot++) {
    const cycle = page * WINDOW + slot + 1;
    if (cycle > d.loops) break;
    el("text", { x: barX(slot) + 8, y: TOP - 14, class: "cycle-label" }, back, `cycle ${cycle}`);
  }
  for (let slot = 0; slot <= WINDOW; slot++) {
    el("line", { x1: barX(slot), y1: TOP - 6, x2: barX(slot), y2: H - 4, class: "bar-line" }, back);
  }

  // Every beat on this page: its time band, then its mark.
  for (const c of cellsByPage[page]) {
    const info = d.layers[c.layer];
    const x0 = xOf(c.cycle, c.offset, page);
    const w = BAR_W / info.beats;
    // Bands go in the back layer and marks in the front one; each sits in its
    // own group carrying the layer class, which is what gives it its colour.
    const band = el("rect", {
      x: x0 + 1.5, y: rowTop(c.layer) + 5, width: Math.max(1, w - 3), height: ROW_H - 10,
      class: `band ${c.status}`,
    }, el("g", { class: `l${c.layer}` }, back));
    const g = el("g", { class: `l${c.layer}` }, front);

    const where = `${info.name} · cycle ${c.cycle}, beat ${c.beat} · ${c.time.toFixed(2)} s`;
    if (c.status === "note") {
      const r = radius(c.layer);
      const y = yOf(c.layer, c.height);
      const m = el("g", { class: info.percussive ? "mark hit" : "mark note" }, g);
      if (info.percussive) {
        const s = r * 0.62, ym = rowTop(c.layer) + ROW_H / 2;
        el("circle", { cx: x0, cy: ym, r }, m);  // invisible, but easier to hover
        el("line", { x1: x0 - s, y1: ym - s, x2: x0 + s, y2: ym + s }, m);
        el("line", { x1: x0 - s, y1: ym + s, x2: x0 + s, y2: ym - s }, m);
      } else {
        el("circle", { cx: x0, cy: y, r }, m);
        el("text", { x: x0, y: y + 0.5, "font-size": Math.min(14, r * 1.05) }, m, c.label);
      }
      tip(m, `${where} · ${pitchWords(c.layer, c)}`);
      marks.push({ node: m, time: c.time });
    } else if (c.status === "rest") {
      const ym = rowTop(c.layer) + ROW_H / 2;
      const r = el("rect", { x: x0 - 6, y: ym - 3, width: 12, height: 6, rx: 1, class: "rest-glyph" }, g);
      tip(r, `${where} · rest`);
    } else {
      tip(band, `${where} · beat switched off`);
    }
  }

  // Lines joining layers that sound at the same instant, drawn from the
  // uppermost to the lowest row involved.
  for (const k of togetherByPage[page]) {
    const x = xOf(k.cycle, k.offset, page);
    const first = Math.min(...k.layers), last = Math.max(...k.layers);
    const line = el("line", {
      x1: x, y1: rowTop(first) + 8, x2: x, y2: rowTop(last) + ROW_H - 8, class: "together",
    }, joins);
    togethers.push({ node: line, time: k.time });
  }

  playhead = el("line", { x1: GUTTER, y1: TOP - 6, x2: GUTTER, y2: H - 4, class: "playhead" }, under);

  document.getElementById("window").textContent = WINDOW === d.loops
    ? `cycles 1–${d.loops}`
    : `cycles ${page * WINDOW + 1}–${Math.min(d.loops, (page + 1) * WINDOW)} of ${d.loops}`;
  document.getElementById("prev").disabled = pages === 1;
  document.getElementById("next").disabled = pages === 1;
  document.documentElement.dataset.notesDrawn = marks.length;
}

// Move the playhead and light up whatever is sounding at time t (seconds).
function show(t) {
  const cycleIndex = Math.min(d.loops - 1, Math.floor(t / d.cycle_duration));
  const page = Math.floor(cycleIndex / WINDOW);
  if (page !== currentPage) drawPage(page);

  const frac = t / d.cycle_duration - cycleIndex;
  const x = barX(cycleIndex - page * WINDOW) + frac * BAR_W;
  playhead.setAttribute("x1", x);
  playhead.setAttribute("x2", x);

  // A note stays lit briefly after it starts -- about a tenth of a second,
  // shorter for fast layers so neighbouring notes do not blur together.
  const glow = 0.13;
  for (const m of marks) m.node.classList.toggle("on", t >= m.time && t - m.time < glow);
  for (const k of togethers) k.node.classList.toggle("on", t >= k.time && t - k.time < glow);

  document.getElementById("clock").textContent =
    `${t.toFixed(2)} / ${d.total_duration.toFixed(2)} s`;
}

// ---------------------------------------------------------------------------
// Audio, through the Web Audio API rather than an <audio> element. An <audio>
// element set to loop leaves a small gap each time it starts over, which is
// exactly wrong for a tool whose whole output is loops. A Web Audio buffer
// loops sample-accurately.
// ---------------------------------------------------------------------------
let ctx = null, buffer = null, source = null;
let playing = false;
let startedAt = 0;  // the audio clock's time when "position 0" would have been
let heldAt = 0;     // where we are while paused

async function loadAudio() {
  if (buffer) return;
  // The audio arrived as base64 text; atob turns it back into raw bytes, which
  // the browser then decodes from WAV into sound it can play.
  const b64 = JSON.parse(document.getElementById("audio-data").textContent);
  const raw = atob(b64);
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  buffer = await ctx.decodeAudioData(bytes.buffer);
}

function position() {
  if (!playing) return heldAt;
  // The audio clock only ever counts up, so wrap it round the loop length.
  return (ctx.currentTime - startedAt) % buffer.duration;
}

async function play() {
  await loadAudio();
  await ctx.resume();  // browsers keep audio off until the user asks for it
  source = ctx.createBufferSource();
  source.buffer = buffer;
  source.loop = true;
  source.connect(ctx.destination);
  source.start(0, heldAt);
  startedAt = ctx.currentTime - heldAt;
  playing = true;
  document.getElementById("play").textContent = "Pause";
  requestAnimationFrame(tick);
}

function pause() {
  heldAt = position();
  source.stop();
  source.disconnect();
  source = null;
  playing = false;
  document.getElementById("play").textContent = "Play";
  show(heldAt);
}

function seek(t) {
  const wasPlaying = playing;
  if (playing) pause();
  // % in JavaScript can return a negative number, so add the length back on.
  heldAt = ((t % d.total_duration) + d.total_duration) % d.total_duration;
  if (wasPlaying) play(); else show(heldAt);
}

// Called by the browser before each screen refresh, about 60 times a second.
// Everything visual is driven from the audio clock, never from a separate
// timer, so the picture cannot drift away from what you hear.
function tick() {
  if (!playing) return;
  show(position());
  requestAnimationFrame(tick);
}

// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------
const playButton = document.getElementById("play");
playButton.addEventListener("click", () => (playing ? pause() : play()));

function changePage(delta) {
  const page = (currentPage + delta + pages) % pages;
  seek(page * WINDOW * d.cycle_duration);
}
document.getElementById("prev").addEventListener("click", () => changePage(-1));
document.getElementById("next").addEventListener("click", () => changePage(1));

document.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
  else if (e.code === "ArrowLeft") changePage(-1);
  else if (e.code === "ArrowRight") changePage(1);
});

// Clicking the grid jumps there. The click arrives in screen pixels; the
// drawing is in its own units, so scale by how wide it currently appears.
svg.addEventListener("click", (e) => {
  const box = svg.getBoundingClientRect();
  const x = (e.clientX - box.left) * (W / box.width);
  if (x < GUTTER || x > GUTTER + AREA) return;
  const slot = Math.floor((x - GUTTER) / BAR_W);
  const frac = (x - GUTTER - slot * BAR_W) / BAR_W;
  seek((currentPage * WINDOW + slot + frac) * d.cycle_duration);
});

// ---------------------------------------------------------------------------
// The text view: the same grid written out, one line per layer per page.
// ---------------------------------------------------------------------------
function textGrid() {
  const nameWidth = Math.max(...d.layers.map((l) => l.name.length)) + 2;
  const lines = [];
  for (let page = 0; page < pages; page++) {
    const firstCycle = page * WINDOW + 1;
    const lastCycle = Math.min(d.loops, firstCycle + WINDOW - 1);
    lines.push(`cycles ${firstCycle}–${lastCycle}`);
    for (let i = 0; i < nLayers; i++) {
      const bars = [];
      for (let cycle = firstCycle; cycle <= lastCycle; cycle++) {
        const beats = cellsByPage[page]
          .filter((c) => c.layer === i && c.cycle === cycle)
          .sort((a, b) => a.beat - b.beat)
          .map((c) => (c.status === "note" ? c.label : c.status === "rest" ? "-" : "."));
        bars.push(beats.join(" "));
      }
      lines.push(`  ${d.layers[i].name.padEnd(nameWidth)}| ${bars.join(" | ")} |`);
    }
    lines.push("");
  }
  lines.push("x = drum hit   - = rest   . = beat switched off");
  return lines.join("\n");
}

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------
document.getElementById("meta").textContent =
  `${d.loops} cycles × ${d.cycle_duration.toFixed(2)} s = ${d.total_duration.toFixed(2)} s` +
  ` · ${nLayers} layers · ${d.lcm} pulses per cycle`;
svg.setAttribute("aria-label",
  `Step notation for ${nLayers} layers over ${d.loops} cycles. The same grid is available as text below.`);
document.getElementById("text-grid").textContent = textGrid();
document.documentElement.dataset.window = WINDOW;

if (stillTime !== null && !Number.isNaN(stillTime)) {
  heldAt = ((stillTime % d.total_duration) + d.total_duration) % d.total_duration;
  playButton.disabled = true;
  document.getElementById("note-text").textContent =
    `Still frame at ${heldAt.toFixed(2)} s — remove ?t= from the address to play`;
}
show(heldAt);
document.documentElement.dataset.ready = "1";
</script>
</body>
</html>
